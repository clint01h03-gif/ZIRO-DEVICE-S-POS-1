        }

        // ==================== FIREBASE (warranty online storage only) ====================
        // Uses Cloud Firestore REST API only (no Firebase SDK). Only warranty reports are stored online.

        function firestoreValueFromJs(v) {
            if (v === null || v === undefined) return { nullValue: null };
            if (typeof v === 'string') return { stringValue: v };
            if (typeof v === 'number') return Number.isInteger(v) ? { integerValue: String(v) } : { doubleValue: v };
            if (typeof v === 'boolean') return { booleanValue: v };
            if (Array.isArray(v)) return { arrayValue: { values: v.map(firestoreValueFromJs) } };
            if (typeof v === 'object') return { mapValue: { fields: firestoreFieldsFromObject(v) } };
            return { stringValue: String(v) };
        }
        function firestoreFieldsFromObject(obj) {
            const fields = {};
            Object.keys(obj || {}).forEach(k => { fields[k] = firestoreValueFromJs(obj[k]); });
            return fields;
        }
        function firestoreValueToJs(v) {
            if (!v) return null;
            if ('stringValue' in v) return v.stringValue;
            if ('integerValue' in v) return parseInt(v.integerValue, 10);
            if ('doubleValue' in v) return v.doubleValue;
            if ('booleanValue' in v) return v.booleanValue;
            if ('nullValue' in v) return null;
            if ('arrayValue' in v) return (v.arrayValue.values || []).map(firestoreValueToJs);
            if ('mapValue' in v) return objectFromFirestoreFields(v.mapValue.fields);
            return null;
        }
        function objectFromFirestoreFields(fields) {
            const obj = {};
            Object.keys(fields || {}).forEach(k => { obj[k] = firestoreValueToJs(fields[k]); });
            return obj;
        }

        function firestoreDocUrl(conf, collection, docId) {
            return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(conf.projectId)}/databases/(default)/documents/${encodeURIComponent(collection)}/${encodeURIComponent(docId)}?key=${encodeURIComponent(conf.apiKey)}`;
        }
        function firestoreCreateUrl(conf, collection, docId) {
            return `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(conf.projectId)}/databases/(default)/documents/${encodeURIComponent(collection)}?documentId=${encodeURIComponent(docId)}&key=${encodeURIComponent(conf.apiKey)}`;
        }

        function describeFirestoreError(status, raw) {
            let detail = '';
            try {
                const j = JSON.parse(raw);
                detail = j?.error?.message || '';
            } catch (_) { detail = (raw || '').slice(0, 200); }
            if (status === 403) {
                return 'Permission denied (403). In Firebase Console → Firestore → Rules, allow read/write for warranties and _meta (see Settings help). Also enable Cloud Firestore API.';
            }
            if (status === 404) {
                return 'Firestore not found (404). Create a Firestore database: Build → Firestore Database → Create database (start in test mode).';
            }
            if (status === 400) {
                return detail || 'Invalid request (400). Check Project ID and API Key from Firebase Console.';
            }
            if (status === 0 || status === 429) {
                return 'Network error — check internet connection and that this page is opened via http/https (not file://).';
            }
            return detail ? `Firestore error (${status}): ${detail}` : `Firestore error (${status})`;
        }

        // Upsert document: PATCH (create-or-replace). Fallback to POST create if needed.
        async function firestoreSetDocument(collection, docId, dataObj, conf) {
            const cfg = conf || state.settings.firebase?.config;
            if (!cfg?.projectId || !cfg?.apiKey) throw new Error('Firebase is not connected — paste config in Settings');
            const body = JSON.stringify({ fields: firestoreFieldsFromObject(dataObj) });
            const headers = { 'Content-Type': 'application/json' };

            let res = await fetch(firestoreDocUrl(cfg, collection, docId), {
                method: 'PATCH',
                headers,
                body
            });
            if (res.ok) return res.json();

            if (res.status === 404 || res.status === 400) {
                const errText1 = await res.text().catch(() => '');
                const res2 = await fetch(firestoreCreateUrl(cfg, collection, docId), {
                    method: 'POST',
                    headers,
                    body
                });
                if (res2.ok) return res2.json();
                if (res2.status === 409) {
                    const res3 = await fetch(firestoreDocUrl(cfg, collection, docId), {
                        method: 'PATCH',
                        headers,
                        body
                    });
                    if (res3.ok) return res3.json();
                    const err3 = await res3.text().catch(() => '');
                    throw new Error(describeFirestoreError(res3.status, err3));
                }
                const err2 = await res2.text().catch(() => '');
                throw new Error(describeFirestoreError(res2.status, err2 || errText1));
            }
            const errText = await res.text().catch(() => '');
            throw new Error(describeFirestoreError(res.status, errText));
        }

        async function firestoreGetDocument(collection, docId, conf) {
            const cfg = conf || state.settings.firebase?.config;
            if (!cfg?.projectId || !cfg?.apiKey) throw new Error('Firebase is not connected');
            const res = await fetch(firestoreDocUrl(cfg, collection, docId), { method: 'GET' });
            if (res.status === 404) return null;
            if (!res.ok) {
                const errText = await res.text().catch(() => '');
                throw new Error(describeFirestoreError(res.status, errText));
            }
            const data = await res.json();
            return objectFromFirestoreFields(data.fields);
        }

        function encodeFirebaseRef(cfg) {
            try {
                const payload = btoa(unescape(encodeURIComponent(JSON.stringify({ p: cfg.projectId, k: cfg.apiKey }))));
                return encodeURIComponent(payload);
            } catch (e) {
                return encodeURIComponent(btoa(JSON.stringify({ p: cfg.projectId, k: cfg.apiKey })));
            }
        }
        function decodeFirebaseRef(str) {
            try {
                const raw = decodeURIComponent(str);
                const json = decodeURIComponent(escape(atob(raw)));
                const obj = JSON.parse(json);
                if (obj && obj.p && obj.k) return { projectId: obj.p, apiKey: obj.k };
            } catch (e) { /* try simple path */ }
            try {
                const obj = JSON.parse(atob(decodeURIComponent(str)));
                if (obj && obj.p && obj.k) return { projectId: obj.p, apiKey: obj.k };
            } catch (e2) { /* ignore */ }
            return null;
        }

        function parseFirebaseConfigInput(raw) {
            if (!raw || !raw.trim()) return null;
            let cleaned = raw.trim();
            cleaned = cleaned.replace(/\/\*[\s\S]*?\*\//g, '');
            cleaned = cleaned.replace(/\/\/.*$/gm, '');
            const match = cleaned.match(/{[\s\S]*}/);
            const objStr = match ? match[0] : cleaned;
            try {
                const obj = Function('"use strict"; return (' + objStr + ');')();
                if (obj && typeof obj === 'object' && obj.apiKey && obj.projectId) {
                    return {
                        apiKey: String(obj.apiKey).trim(),
                        projectId: String(obj.projectId).trim(),
                        authDomain: obj.authDomain ? String(obj.authDomain).trim() : '',
                        storageBucket: obj.storageBucket ? String(obj.storageBucket).trim() : '',
                        appId: obj.appId ? String(obj.appId).trim() : '',
                        messagingSenderId: obj.messagingSenderId ? String(obj.messagingSenderId).trim() : ''
                    };
                }
            } catch (e) { /* ignore */ }
            try {
                const obj = JSON.parse(objStr);
                if (obj && obj.apiKey && obj.projectId) {
                    return {
                        apiKey: String(obj.apiKey).trim(),
                        projectId: String(obj.projectId).trim(),
                        authDomain: obj.authDomain ? String(obj.authDomain).trim() : '',
                        storageBucket: obj.storageBucket ? String(obj.storageBucket).trim() : '',
                        appId: obj.appId ? String(obj.appId).trim() : '',
                        messagingSenderId: obj.messagingSenderId ? String(obj.messagingSenderId).trim() : ''
                    };
                }
            } catch (e2) { /* ignore */ }
            return null;
        }

        async function saveFirebaseSettings(e) {
            e.preventDefault();
            const form = e.target;
            const raw = form.firebaseConfigInput.value;
            const cfg = parseFirebaseConfigInput(raw);
            if (!cfg) {
                showToast('Config read aagala — Firebase Console la irunthu full firebaseConfig snippet paste pannunga', 'error');
                return;
            }
            if (!cfg.apiKey || !cfg.projectId) {
                showToast('apiKey and projectId required', 'error');
                return;
            }
            const btn = form.querySelector('button[type="submit"]');
            const oldHtml = btn ? btn.innerHTML : '';
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Connecting...'; }
            try {
                await firestoreSetDocument('_meta', 'connection-test', {
                    app: 'zero-device-pos',
                    testedAt: new Date().toISOString(),
                    ok: true
                }, cfg);
                state.settings.firebase = {
                    config: cfg,
                    connected: true,
                    lastConnectedAt: new Date().toISOString()
                };
                saveData();
                showToast('Firebase connected successfully!', 'success');
                setTimeout(() => resyncPendingWarranties(), 400);
            } catch (err) {
                console.warn('Firebase connect failed', err);
                state.settings.firebase = {
                    config: cfg,
                    connected: false,
                    lastConnectedAt: state.settings.firebase?.lastConnectedAt || null
                };
                saveData();
                showToast(err.message || 'Firebase connect fail aachu', 'error');
            }
            if (btn) { btn.disabled = false; btn.innerHTML = oldHtml; }
            renderSettings();
        }

        function disconnectFirebase() {
            if (!confirm('Disconnect Firebase? Warranty QR online check work aagathu until reconnect.')) return;
            state.settings.firebase = {
                config: state.settings.firebase?.config || null,
                connected: false,
                lastConnectedAt: state.settings.firebase?.lastConnectedAt || null
            };
            saveData();
            showToast('Firebase disconnected', 'info');
            renderSettings();
        }

        async function resyncPendingWarranties() {
            if (!state.settings.firebase?.connected) return;
            const pending = (state.bills || []).filter(b => b.billWarrantyCode && !b.firebaseSynced);
            for (const bill of pending.slice(-20)) {
                try { await syncBillWarrantyToFirebase(bill); } catch (_) {}
            }
        }

        async function syncBillWarrantyToFirebase(bill) {
            if (!state.settings.firebase?.connected || !bill?.billWarrantyCode) return false;
            const items = state.warranties
                .filter(w => w.billWarrantyCode === bill.billWarrantyCode)
                .map(w => ({
                    code: w.code,
                    productName: w.productName,
                    brand: w.brand || '',
                    chip: w.chip || '',
                    ram: w.ram || '',
                    storage: w.storage || '',
                    size: w.size || '',
                    specs: w.specs || '',
                    startDate: w.startDate,
                    endDate: w.endDate,
                    months: w.months,
                    status: w.status,
                    cancelledAt: w.cancelledAt || '',
                    cancelReason: w.cancelReason || ''
                }));
            const doc = {
                billWarrantyCode: bill.billWarrantyCode,
                invoiceNo: bill.invoiceNo,
                billId: bill.id,
                customerName: bill.customerName,
                customerNic: bill.customerNic,
                customerMobile: bill.customerMobile,
                businessName: state.settings.businessName,
                businessPhone: state.settings.businessPhone,
                businessEmail: state.settings.businessEmail,
                businessAddress: state.settings.businessAddress || '',
                createdAt: bill.createdAt,
                updatedAt: new Date().toISOString(),
                items
            };
            try {
                await firestoreSetDocument('warranties', bill.billWarrantyCode, doc);
                bill.firebaseSynced = true;
                saveData();
                return true;
            } catch (err) {
                console.warn('Firebase warranty sync failed', err);
                bill.firebaseSynced = false;
                saveData();
                showToast('Warranty local-la save aachu (Firebase sync fail — connection check pannunga)', 'warning');
                return false;
            }
        }

        // ==================== PUBLIC WARRANTY QR VIEW ====================
        function tryRenderPublicWarrantyLink() {
            const hash = window.location.hash || '';
            if (!hash.startsWith('#warranty/')) return false;
            const code = decodeURIComponent(hash.replace('#warranty/', '').split('&')[0].split('?')[0]).trim();
            if (!code) return false;
            const params = new URLSearchParams(window.location.search);
            const fbParam = params.get('fb');
            let fbRef = fbParam ? decodeFirebaseRef(fbParam) : null;
            if (!fbRef && state.settings.firebase?.config?.projectId && state.settings.firebase?.config?.apiKey) {
                fbRef = {
                    projectId: state.settings.firebase.config.projectId,
                    apiKey: state.settings.firebase.config.apiKey
                };
            }
            document.body.innerHTML = '<div style="font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f1f5f9;color:#64748b;"><div style="text-align:center"><div style="margin:0 auto 12px;border:3px solid #e2e8f0;border-top-color:#0c8ce9;border-radius:50%;width:40px;height:40px;animation:spin .8s linear infinite"></div><p>Loading warranty...</p></div></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>';
            renderPublicWarrantyPage(code, fbRef);
            return true;
        }

        async function renderPublicWarrantyPage(code, fbRef) {
            if (!fbRef || !fbRef.projectId || !fbRef.apiKey) {
                document.open();
                document.write(buildWarrantyMessageHtml(
                    'Warranty link incomplete',
                    'This QR is missing Firebase connection details. Shop must connect Firebase in Settings and print a new invoice.'
                ));
                document.close();
                return;
            }
            try {
                const data = await firestoreGetDocument('warranties', code, fbRef);
                if (!data) {
                    document.open();
                    document.write(buildWarrantyMessageHtml(
                        'Warranty not found',
                        'No warranty report found for this code. It may not have been synced yet, or the code is invalid.'
                    ));
                    document.close();
                    return;
                }
                document.open();
                document.write(buildWarrantyReportHtml(data));
                document.close();
            } catch (err) {
                document.open();
                document.write(buildWarrantyMessageHtml(
                    'Unable to load warranty',
                    'Check internet connection and try again. ' + (err.message || '')
                ));
                document.close();
            }
        }

        function buildWarrantyMessageHtml(title, message) {
            const safeTitle = String(title).replace(/</g, '&lt;');
            const safeMsg = String(message).replace(/</g, '&lt;');
            return `<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${safeTitle}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:420px;background:#fff;border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 20px 50px -20px rgba(11,63,110,.35);border:1px solid #e2e8f0}
h1{font-size:1.1rem;margin-bottom:10px;color:#0b3f6e}
p{font-size:.875rem;color:#64748b;line-height:1.5}
button{margin-top:18px;background:#0c8ce9;color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:.85rem;font-weight:600;cursor:pointer}
</style></head><body>
<div class="card"><h1>${safeTitle}</h1><p>${safeMsg}</p><button onclick="location.reload()">Try Again</button></div>
</body></html>`;
        }

        function buildWarrantyReportHtml(data) {
            const s = {
                businessName: data.businessName || 'Zero Device',
                businessPhone: data.businessPhone || '',
                businessEmail: data.businessEmail || '',
                businessAddress: data.businessAddress || ''
            };
            const items = data.items || [];
            const anyCancelled = items.some(w => w.status === 'Cancelled');
            const itemBlocks = items.map(w => {
                const isCancelled = w.status === 'Cancelled';
                const isExpired = !isCancelled && w.endDate && new Date(w.endDate) < new Date();
                const statusLabel = isCancelled ? 'CANCELLED' : isExpired ? 'EXPIRED' : 'ACTIVE';

        function addUser(e) {
            e.preventDefault();
            const form = e.target;
            const username = form.username.value.trim();
            if (state.users.find(u => u.username === username)) {
                showToast('Username already exists', 'error');
                return;
            }
            state.users.push({
                id: Date.now(),
                username,
                password: form.password.value,
                name: form.name.value.trim(),
                role: form.role.value,
                createdAt: new Date().toISOString()
            });
            saveData();
            closeModal();
            showToast('User added successfully', 'success');
            renderSettings();
        }

        function deleteUser(id) {
            if (!confirm('Delete this user?')) return;
            state.users = state.users.filter(u => u.id !== id);
            saveData();
            showToast('User deleted', 'success');
            renderSettings();
        }

        // ==================== START ====================
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
