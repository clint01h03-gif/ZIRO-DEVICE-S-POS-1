<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Device — POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            200: '#b9dffd',
                            300: '#7cc5fb',
                            400: '#36a7f6',
                            500: '#0c8ce9',
                            600: '#006fc7',
                            700: '#0158a1',
                            800: '#064b85',
                            900: '#0b3f6e',
                            950: '#072849'
                        },
                        accent: {
                            50: '#f8f7f4',
                            100: '#efede6',
                            200: '#ddd8cc',
                            300: '#c7beab',
                            400: '#b0a38b',
                            500: '#9c8c72',
                            600: '#8a7960',
                            700: '#726350',
                            800: '#5f5344',
                            900: '#50463a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Playfair Display', 'serif']
                    },
                    boxShadow: {
                        'soft': '0 2px 15px -3px rgba(0, 0, 0, 0.07), 0 10px 20px -2px rgba(0, 0, 0, 0.04)',
                        'premium': '0 4px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04)',
                        'card': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03)'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s ease-out',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'slide-in-right': 'slideInRight 0.3s ease-out',
                        'scale-in': 'scaleIn 0.3s ease-out',
                        'pulse-soft': 'pulseSoft 2s infinite'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideInRight: {
                            '0%': { opacity: '0', transform: 'translateX(20px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' }
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        },
                        pulseSoft: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.7' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        * { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        body { font-family: 'Inter', system-ui, sans-serif; }
        
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .sidebar-item {
            transition: all 0.2s ease;
        }
        .sidebar-item:hover {
            background: rgba(12, 140, 233, 0.08);
        }
        .sidebar-item.active {
            background: linear-gradient(135deg, #0c8ce9 0%, #006fc7 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(12, 140, 233, 0.3);
        }
        
        .stat-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.12);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #0c8ce9 0%, #006fc7 100%);
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(12, 140, 233, 0.35);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .product-card {
            transition: all 0.25s ease;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .modal-backdrop {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
        }
        
        .invoice-paper {
            background: white;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.05), 0 25px 60px -15px rgba(0,0,0,0.18);
        }
        
        .invoice-header-accent {
            background: linear-gradient(135deg, #0c8ce9 0%, #0158a1 50%, #072849 100%);
        }
        
        .invoice-product-img {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0c8ce9;
            box-shadow: 0 0 0 3px rgba(12, 140, 233, 0.15);
        }
        
        .loading-spinner {
            border: 3px solid #e2e8f0;
            border-top-color: #0c8ce9;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast {
            animation: slideInRight 0.3s ease-out;
        }
        
        .table-row {
            transition: background 0.15s ease;
        }
        .table-row:hover {
            background: #f8fafc;
        }
        
        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.025em;
        }
        
        .image-upload-zone {
            border: 2px dashed #cbd5e1;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .image-upload-zone:hover {
            border-color: #0c8ce9;
            background: rgba(12, 140, 233, 0.04);
        }
        .image-upload-zone.has-image {
            border-style: solid;
            border-color: #e2e8f0;
        }
        
        /* Print styles for invoice — fit to a single A5 sheet */
        @page {
            size: A5;
            margin: 6mm;
        }
        @media print {
            html, body { height: auto !important; }
            body * { visibility: hidden; }
            #invoice-print-area, #invoice-print-area * { visibility: visible; }
            #invoice-print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100% !important;
                max-width: 148mm !important;
                max-height: none !important;
                overflow: visible !important;
                box-shadow: none !important;
                border-radius: 0 !important;
            }
            .no-print { display: none !important; }
            .invoice-product-img { print-color-adjust: exact; -webkit-print-color-adjust: exact; width: 36px !important; height: 36px !important; }
            .invoice-3d, .invoice-3d-deep, .invoice-badge-3d, .invoice-status-paid, .invoice-status-unpaid {
                box-shadow: none !important;
            }
            .invoice-total-box, .invoice-spec-box {
                box-shadow: none !important;
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            .invoice-header-accent, .invoice-desc-banner, .invoice-status-paid, .invoice-status-unpaid {
                print-color-adjust: exact;
                -webkit-print-color-adjust: exact;
            }
            #invoice-print-area .invoice-body { padding: 10px 12px !important; }
            #invoice-print-area h1 { font-size: 16px !important; }
            #invoice-print-area .invoice-header-accent { height: 4px !important; }
            #invoice-print-area table { page-break-inside: avoid; font-size: 11px !important; }
            #invoice-print-area .sign-row { page-break-inside: avoid; margin-top: 10px !important; }
            #invoice-qr-code img, #invoice-qr-code canvas { width: 56px !important; height: 56px !important; }
        }

        /* Layered "3D box" styling for the invoice */
        .invoice-3d {
            box-shadow: 0 1px 0 rgba(11,63,110,0.05), 0 2px 0 rgba(11,63,110,0.04),
                        0 10px 22px -8px rgba(11,63,110,0.22), 0 2px 6px rgba(11,63,110,0.08);
            border: 1px solid rgba(11,63,110,0.08);
        }
        .invoice-3d-deep {
            box-shadow: 3px 3px 0 rgba(11,63,110,0.10), 6px 6px 0 rgba(11,63,110,0.06),
                        0 18px 34px -14px rgba(11,63,110,0.35);
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        }
        .invoice-badge-3d {
            box-shadow: 0 2px 0 rgba(4,90,50,0.25), 0 5px 10px -2px rgba(4,120,66,0.35);
        }
        .invoice-status-paid {
            background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%);
            box-shadow: 0 3px 0 rgba(4,90,50,0.3), 0 8px 16px -4px rgba(16,185,129,0.45),
                        inset 0 1px 0 rgba(255,255,255,0.25);
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .invoice-status-unpaid {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
            box-shadow: 0 3px 0 rgba(146,64,14,0.3), 0 8px 16px -4px rgba(245,158,11,0.45),
                        inset 0 1px 0 rgba(255,255,255,0.25);
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
        }
        .invoice-total-box {
            background: linear-gradient(150deg, #0c8ce9 0%, #0158a1 55%, #072849 100%);
            box-shadow: 4px 4px 0 rgba(7,40,73,0.14), 8px 8px 0 rgba(7,40,73,0.08),
                        0 20px 36px -14px rgba(7,40,73,0.45);
        }
        .invoice-spec-box {
            background: linear-gradient(150deg, #0158a1 0%, #072849 100%);
            box-shadow: 3px 3px 0 rgba(7,40,73,0.12), 6px 6px 0 rgba(7,40,73,0.06),
                        0 16px 30px -12px rgba(7,40,73,0.4);
        }
        .invoice-desc-banner {
            background: linear-gradient(90deg, rgba(12,140,233,0.08) 0%, rgba(12,140,233,0.03) 50%, rgba(1,88,161,0.06) 100%);
            border-left: 3px solid #0c8ce9;
        }
        .sign-box {
            border: 1.5px dashed #94a3b8;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #0c8ce9, #0158a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Premium card refinements */
        .stat-card, .bg-white.rounded-xl {
            box-shadow: 0 1px 3px 0 rgba(0,0,0,0.04), 0 1px 2px -1px rgba(0,0,0,0.04);
        }

        /* Settings accordion */
        .settings-section {
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            overflow: hidden;
            background: white;
            transition: box-shadow 0.3s ease;
        }
        .settings-section:hover {
            box-shadow: 0 8px 24px -8px rgba(12, 140, 233, 0.15);
        }
        .settings-section-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem;
            text-align: left;
            font-weight: 600;
            color: #1e293b;
            background: linear-gradient(135deg, #f8fafc 0%, #ffffff 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            cursor: pointer;
        }
        .settings-section-btn:hover {
            background: linear-gradient(135deg, #e0effe 0%, #f0f7ff 100%);
        }
        .settings-section-btn .chevron {
            margin-left: auto;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            color: #0c8ce9;
        }
        .settings-section.open .settings-section-btn .chevron {
            transform: rotate(180deg);
        }
        .settings-section-btn .icon-wrap {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0c8ce9 0%, #006fc7 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(12, 140, 233, 0.3);
            transition: transform 0.3s ease;
        }
        .settings-section-btn:hover .icon-wrap {
            transform: scale(1.08);
        }
        .settings-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1), padding 0.35s ease;
            padding: 0 1.25rem;
        }
        .settings-section.open .settings-body {
            max-height: 1200px;
            padding: 0 1.25rem 1.25rem;
        }
        .animated-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .animated-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }
        .animated-btn:hover::after {
            transform: translateX(100%);
        }
        .warranty-badge-active {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .warranty-badge-cancelled {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .warranty-badge-expired {
            background: linear-gradient(135deg, #94a3b8, #64748b);
            color: white;
        }
    </style>

</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 z-[100] bg-white flex flex-col items-center justify-center">
        <div class="text-center animate-fade-in">
            <div class="w-20 h-20 mx-auto mb-6 rounded-2xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-premium">
                <i class="fas fa-laptop text-white text-3xl"></i>
            </div>
            <h1 class="font-display text-3xl font-bold text-slate-800 mb-2">Zero Device</h1>
            <p class="text-slate-500 text-sm mb-8">Premium POS System</p>
            <div class="loading-spinner mx-auto"></div>
        </div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 z-50 hidden bg-gradient-to-br from-slate-100 via-white to-primary-50 flex items-center justify-center p-4">
        <div class="w-full max-w-md animate-scale-in">
            <div class="bg-white rounded-2xl shadow-premium p-8 border border-slate-100">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 mx-auto mb-4 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-lg">
                        <i class="fas fa-laptop text-white text-2xl"></i>
                    </div>
                    <h1 class="font-display text-2xl font-bold text-slate-800">Zero Device</h1>
                    <p class="text-slate-500 text-sm mt-1">Sign in to your POS system</p>
                </div>
                
                <form id="login-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" id="login-username" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white transition-colors"
                                placeholder="Enter username" autocomplete="username">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="login-password" required
                                class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white transition-colors"
                                placeholder="Enter password" autocomplete="current-password">
                        </div>
                    </div>
                    <button type="submit" class="w-full btn-primary text-white font-medium py-2.5 rounded-lg">
                        <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                    </button>
                </form>
                
                <p class="text-center text-xs text-slate-400 mt-6">
                    Default: <span class="font-medium text-slate-500">admin / admin123</span>
                </p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden min-h-screen flex">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-white border-r border-slate-200 flex flex-col fixed h-full z-40 shadow-soft">
            <div class="p-5 border-b border-slate-100">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-md">
                        <i class="fas fa-laptop text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-display font-bold text-lg text-slate-800 leading-tight">Zero Device</h1>
                        <p class="text-xs text-slate-400">POS System</p>
                    </div>
                </div>
            </div>
            
            <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
                <button data-page="dashboard" class="sidebar-item active w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-left">
                    <i class="fas fa-chart-pie w-5 text-center"></i>
                    <span>Dashboard</span>
                </button>
                <button data-page="billing" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 text-left">
                    <i class="fas fa-cash-register w-5 text-center"></i>
                    <span>Billing</span>
                </button>
                <button data-page="inventory" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 text-left">
                    <i class="fas fa-boxes-stacked w-5 text-center"></i>
                    <span>Inventory</span>
                </button>
                <button data-page="customers" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 text-left">
                    <i class="fas fa-users w-5 text-center"></i>
                    <span>Customers</span>
                </button>
                <button data-page="sales" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 text-left">
                    <i class="fas fa-receipt w-5 text-center"></i>
                    <span>Sales History</span>
                </button>
                <button data-page="warranty" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 text-left">
                    <i class="fas fa-shield-halved w-5 text-center"></i>
                    <span>Warranty</span>
                </button>
                <button data-page="settings" class="sidebar-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-slate-600 text-left">
                    <i class="fas fa-cog w-5 text-center"></i>
                    <span>Settings</span>
                </button>
            </nav>
            
            <div class="p-4 border-t border-slate-100">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-9 h-9 rounded-full bg-primary-100 flex items-center justify-center">
                        <i class="fas fa-user text-primary-600 text-sm"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p id="current-user-name" class="text-sm font-medium text-slate-800 truncate">Admin</p>
                        <p class="text-xs text-slate-400">Logged in</p>
                    </div>
                </div>
                <button id="logout-btn" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-red-600 hover:bg-red-50 transition-colors">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 ml-64 min-h-screen">
            <!-- Top Bar -->
            <header class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-3 flex items-center justify-between">
                <div>
                    <h2 id="page-title" class="text-xl font-semibold text-slate-800">Dashboard</h2>
                    <p id="page-subtitle" class="text-sm text-slate-500">Overview of your business</p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <p id="current-date" class="text-sm font-medium text-slate-700"></p>
                        <p id="current-time" class="text-xs text-slate-400"></p>
                    </div>
                    <div class="w-px h-8 bg-slate-200"></div>
                    <button id="quick-bill-btn" class="btn-primary text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2">
                        <i class="fas fa-plus"></i>
                        <span>New Bill</span>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div id="page-content" class="p-6">
                <!-- Pages will be injected here -->
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-[90] space-y-2"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <script>
        // ==================== DATA & STATE ====================
        const APP_VERSION = '1.2.0';

        const STORAGE_KEY = 'zero_device_pos_data';
        
        let state = {
            currentUser: null,
            products: [],
            customers: [],
            bills: [],
            warranties: [],
            users: [],
            settings: {
                businessName: 'Zero Device',
                businessAddress: '123 Tech Avenue, Colombo 03, Sri Lanka',
                businessPhone: '+94 11 234 5678',

        // ==================== DATA PERSISTENCE ====================
        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    state = { ...state, ...data };
                    // Ensure newer settings fields exist for older saves
                    if (!state.settings.businessDescription) {
                        state.settings.businessDescription = 'Zero Device is a premium technology retail store dedicated to providing high-quality laptops, computers, accessories, and modern digital solutions. We offer carefully selected products from trusted brands with a strong focus on quality, reliability, performance, and customer satisfaction. Whether you are a student, professional, business owner, creator, or technology enthusiast, Zero Device helps you find the right technology for your needs.';
                    }
                    if (!state.settings.businessWebsite) {
                        state.settings.businessWebsite = 'www.zerodevice.lk';
                    }
                    if (!state.settings.warrantyMonths) {
                        state.settings.warrantyMonths = 12;
                    }
                    if (!state.settings.firebase) {
                        state.settings.firebase = { config: null, connected: false, lastConnectedAt: null };
                    }
                    // Drop legacy Google Drive / QR base URL settings from older saves
                    delete state.settings.googleDrive;
                    delete state.settings.warrantyBaseUrl;
                    if (!state.warranties) state.warranties = [];
                    if (!state.nextWarrantyId) state.nextWarrantyId = 1;
                    // Migrate older bills without paymentStatus
                    if (state.bills && state.bills.length) {
                        state.bills.forEach(b => {
                            if (!b.paymentStatus) b.paymentStatus = 'Paid';
                        });
                    }
                }
            } catch (e) {
                console.error('Failed to load data:', e);
                showToast('Failed to load saved data', 'error');
            }
        }


        function saveData() {
            try {
                const toSave = {
                    products: state.products,
                    customers: state.customers,
                    bills: state.bills,
                    warranties: state.warranties,
                    users: state.users,
                    settings: state.settings,
                    nextProductId: state.nextProductId,
                    nextBillId: state.nextBillId,
                    nextCustomerId: state.nextCustomerId,
                    nextWarrantyId: state.nextWarrantyId
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
            } catch (e) {
                console.error('Failed to save data:', e);
                showToast('Failed to save data', 'error');
            }
        }

        function exportData() {
            const data = {
                version: APP_VERSION,
                exportedAt: new Date().toISOString(),
                products: state.products,
                customers: state.customers,
                bills: state.bills,
                warranties: state.warranties,
                users: state.users.map(u => ({ ...u, password: '***' })), // mask passwords
                settings: state.settings,
                nextProductId: state.nextProductId,
                nextBillId: state.nextBillId,
                nextCustomerId: state.nextCustomerId,
                nextWarrantyId: state.nextWarrantyId
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `zero_device_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Data exported successfully', 'success');
        }

        function importData(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.products) state.products = data.products;
                    if (data.customers) state.customers = data.customers;
                    if (data.bills) state.bills = data.bills;
                    if (data.warranties) state.warranties = data.warranties;
                    if (data.settings) state.settings = { ...state.settings, ...data.settings };
                    if (data.nextProductId) state.nextProductId = data.nextProductId;
                    if (data.nextBillId) state.nextBillId = data.nextBillId;
                    if (data.nextCustomerId) state.nextCustomerId = data.nextCustomerId;
                    if (data.nextWarrantyId) state.nextWarrantyId = data.nextWarrantyId;
                    // Note: users not imported for security, or handle carefully
                    saveData();
                    showToast('Data imported successfully. Refreshing...', 'success');
                    setTimeout(() => location.reload(), 1000);
                } catch (err) {
                    showToast('Invalid backup file', 'error');
                }
            };
            reader.readAsText(file);
        }

        // ==================== AUTH ====================
        function checkAuth() {
            const session = sessionStorage.getItem('zd_session');
            if (session) {
                try {
                    const user = JSON.parse(session);
                    state.currentUser = user;
                    document.getElementById('current-user-name').textContent = user.name || user.username;
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('main-app').classList.remove('hidden');
                    navigateTo('dashboard');
                } catch {
                    showLogin();
                }
            } else {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            
            const user = state.users.find(u => u.username === username && u.password === password);
            if (user) {
                state.currentUser = { id: user.id, username: user.username, name: user.name, role: user.role };
                sessionStorage.setItem('zd_session', JSON.stringify(state.currentUser));
                document.getElementById('current-user-name').textContent = user.name || user.username;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                showToast(`Welcome back, ${user.name || user.username}!`, 'success');
                navigateTo('dashboard');
            } else {
                showToast('Invalid username or password', 'error');
            }
        }

        function handleLogout() {
            sessionStorage.removeItem('zd_session');
            state.currentUser = null;
            showLogin();
            document.getElementById('login-username').value = '';
            document.getElementById('login-password').value = '';
            showToast('Logged out successfully', 'info');
        }

            });

                dashboard: ['Dashboard', 'Overview of your business'],

                inventory: ['Inventory', 'Manage products and stock'],
                customers: ['Customers', 'View and manage customer records'],
                sales: ['Sales History', 'View all past transactions'],
                warranty: ['Warranty', 'View and manage product warranties'],
                settings: ['Settings', 'Configure your POS system']
            };
            
            document.getElementById('page-title').textContent = titles[page][0];
            document.getElementById('page-subtitle').textContent = titles[page][1];
            
            const content = document.getElementById('page-content');
            content.innerHTML = '';
            content.className = 'p-6 animate-fade-in';
            
            switch(page) {
                case 'dashboard': renderDashboard(); break;
                case 'billing': renderBilling(); break;
                case 'inventory': renderInventory(); break;
                case 'customers': renderCustomers(); break;
                case 'sales': renderSalesHistory(); break;
                case 'warranty': renderWarranty(); break;
                case 'settings': renderSettings(); break;
            }
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-LK', {
                style: 'currency',
                currency: state.settings.currency || 'LKR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(amount);
        }

        function formatDate(iso) {
            return new Date(iso).toLocaleDateString('en-GB', {
                day: '2-digit', month: 'short', year: 'numeric'
            });
        }

        function formatDateTime(iso) {
            return new Date(iso).toLocaleString('en-GB', {
                day: '2-digit', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function updateDateTime() {
            const now = new Date();
            document.getElementById('current-date').textContent = now.toLocaleDateString('en-GB', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-GB', {
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-emerald-50 border-emerald-200 text-emerald-800',
                error: 'bg-red-50 border-red-200 text-red-800',
                info: 'bg-blue-50 border-blue-200 text-blue-800',
                warning: 'bg-amber-50 border-amber-200 text-amber-800'
            };
            const icons = {
                success: 'fa-check-circle text-emerald-500',
                error: 'fa-exclamation-circle text-red-500',
                info: 'fa-info-circle text-blue-500',
                warning: 'fa-exclamation-triangle text-amber-500'
            };
            
            const toast = document.createElement('div');
            toast.className = `toast flex items-center gap-3 px-4 py-3 rounded-lg border shadow-soft ${colors[type]} min-w-[280px]`;
            toast.innerHTML = `
                <i class="fas ${icons[type]}"></i>
                <span class="text-sm font-medium flex-1">${message}</span>
                <button class="text-slate-400 hover:text-slate-600" onclick="this.parentElement.remove()">
                    <i class="fas fa-times text-xs"></i>
                </button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function renderSalesChart() {
            const ctx = document.getElementById('sales-chart');
            if (!ctx) return;
            
            const labels = [];
            const data = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                labels.push(d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric' }));
                const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
                const dayEnd = new Date(dayStart);
                dayEnd.setDate(dayEnd.getDate() + 1);
                const sales = state.bills
                    .filter(b => {
                        const bd = new Date(b.createdAt);
                        return bd >= dayStart && bd < dayEnd;
                    })
                    .reduce((s, b) => s + b.grandTotal, 0);
                data.push(sales);
            }
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Sales',
                        data,
                        borderColor: '#0c8ce9',
                        backgroundColor: 'rgba(12, 140, 233, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#0c8ce9',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#f1f5f9' },
                            ticks: {
                                callback: v => formatCurrency(v).replace('LKR', '').trim()
                            }
                        },
                        x: { grid: { display: false } }
                    },
                    animation: { duration: 1000, easing: 'easeOutQuart' }
                }
            });
        }

        function renderProfitChart() {
            const ctx = document.getElementById('profit-chart');
            if (!ctx) return;
            
            // Monthly profit for last 6 months
            const labels = [];
            const data = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date();
                d.setMonth(d.getMonth() - i);
                labels.push(d.toLocaleDateString('en-GB', { month: 'short', year: '2-digit' }));
                const monthStart = new Date(d.getFullYear(), d.getMonth(), 1);
                const monthEnd = new Date(d.getFullYear(), d.getMonth() + 1, 1);
                const profit = state.bills
                    .filter(b => {
                        const bd = new Date(b.createdAt);
                        return bd >= monthStart && bd < monthEnd;
                    })
                    .reduce((s, b) => s + (b.profit || 0), 0);
                data.push(profit);
            }
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Profit',
                        data,
                        backgroundColor: 'rgba(16, 185, 129, 0.8)',
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: '#f1f5f9' },
                            ticks: {
                                callback: v => formatCurrency(v).replace('LKR', '').trim()
                            }
                        },
                        x: { grid: { display: false } }

        function filterBillingProducts() {
            const query = document.getElementById('product-search').value.toLowerCase();
            const cat = document.getElementById('category-filter').value;
            let filtered = state.products;
            if (query) {
                filtered = filtered.filter(p => 
                    p.name.toLowerCase().includes(query) ||
                    String(p.id).includes(query) ||
                    (p.category || '').toLowerCase().includes(query) ||
                    (p.brand || '').toLowerCase().includes(query)
                );
            }
            if (cat) filtered = filtered.filter(p => p.category === cat);
            document.getElementById('billing-product-grid').innerHTML = renderBillingProductCards(filtered);
        }

        function addToCart(productId) {
            const product = state.products.find(p => p.id === productId);
            if (!product || product.stock <= 0) {
                showToast('Product out of stock', 'warning');
                return;
            }
            
            const existing = billingCart.find(c => c.productId === productId);
            if (existing) {
                if (existing.qty >= product.stock) {
                    showToast('Cannot exceed available stock', 'warning');
                    return;
                }
                existing.qty++;
            } else {
                billingCart.push({
                    productId: product.id,
                    name: product.name,
                    price: product.sellingPrice,
                    cost: product.buyingCost,
                    qty: 1,
                    image: product.image,
                    brand: product.brand || '',
                    ram: product.ram || '',
                    storage: product.storage || '',
                    size: product.size || '',
                    chip: product.chip || '',
                    specs: product.specs || ''
                });
            }
            updateCartUI();
            showToast(`Added ${product.name}`, 'success');
        }

        function updateCartQty(productId, delta) {
            const item = billingCart.find(c => c.productId === productId);
            if (!item) return;
            const product = state.products.find(p => p.id === productId);
            const newQty = item.qty + delta;
            if (newQty <= 0) {
                billingCart = billingCart.filter(c => c.productId !== productId);
            } else if (newQty > product.stock) {
                showToast('Cannot exceed available stock', 'warning');
                return;
            } else {
                item.qty = newQty;
            }
            updateCartUI();
        }

        function removeFromCart(productId) {
            billingCart = billingCart.filter(c => c.productId !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const countEl = document.getElementById('cart-count');
            
            if (!billingCart.length) {
                container.innerHTML = '<p class="text-sm text-slate-400 text-center py-6">No items added yet</p>';
                countEl.textContent = '0 items';
            } else {
                countEl.textContent = `${billingCart.reduce((s, i) => s + i.qty, 0)} items`;
                container.innerHTML = billingCart.map(item => `
                    <div class="flex items-center gap-2 p-2 rounded-lg bg-slate-50">
                        <img src="${item.image}" class="w-10 h-10 rounded object-cover" onerror="this.src='https://via.placeholder.com/40'">

                        <div class="flex items-center gap-1">

                                <i class="fas fa-minus"></i>
                            </button>
                            <span class="text-xs font-medium w-5 text-center">${item.qty}</span>
                            <button onclick="updateCartQty(${item.productId}, 1)" class="w-6 h-6 rounded bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 text-xs">
                                <i class="fas fa-plus"></i>

            updateCartTotals();

        function updateCartTotals() {
            const subtotal = billingCart.reduce((s, i) => s + (i.price * i.qty), 0);
            const discount = parseFloat(document.getElementById('cart-discount')?.value) || 0;
            const total = Math.max(0, subtotal - discount);
            
            document.getElementById('cart-subtotal').textContent = formatCurrency(subtotal);
            document.getElementById('cart-total').textContent = formatCurrency(total);
        }

            if (method === 'Loan') {

            } else if (statusEl.value === 'Unpaid' && method !== 'Loan') {

        function processBill() {
            const name = document.getElementById('bill-customer-name').value.trim();
            const nic = document.getElementById('bill-customer-nic').value.trim();
            const mobile = document.getElementById('bill-customer-mobile').value.trim();
            
            if (!name || !nic || !mobile) {
                showToast('Customer name, NIC, and mobile are mandatory', 'error');
                return;
            }
            
            if (!billingCart.length) {
                showToast('Please add at least one product', 'error');
                return;
            }
            
            // Validate stock
            for (const item of billingCart) {
                const product = state.products.find(p => p.id === item.productId);
                if (!product || product.stock < item.qty) {
                    showToast(`Insufficient stock for ${item.name}`, 'error');
                    return;
                }
            }
            
            const subtotal = billingCart.reduce((s, i) => s + (i.price * i.qty), 0);
            const discount = parseFloat(document.getElementById('cart-discount').value) || 0;
            const grandTotal = Math.max(0, subtotal - discount);
            const profit = billingCart.reduce((s, i) => s + ((i.price - i.cost) * i.qty), 0) - discount;
            const paymentMethod = document.getElementById('payment-method').value;
            let paymentStatus = document.getElementById('payment-status')?.value || 'Paid';
            // Auto-set Unpaid when Loan is selected
            if (paymentMethod === 'Loan') paymentStatus = 'Unpaid';
            
            // Find or create customer
            let customer = state.customers.find(c => c.nic === nic);
            if (!customer) {
                customer = {
                    id: state.nextCustomerId++,
                    name,
                    nic,
                    mobile,
                    email: '',
                    createdAt: new Date().toISOString()
                };
                state.customers.push(customer);
            } else {
                // Update name/mobile if changed
                customer.name = name;
                customer.mobile = mobile;
            }
            
            // Create bill
            const invoiceNo = generateInvoiceNumber();
            const bill = {
                id: state.nextBillId++,
                invoiceNo,
                customerId: customer.id,
                customerName: name,
                customerNic: nic,
                customerMobile: mobile,
                items: billingCart.map(i => ({ ...i })),
                subtotal,
                discount,
                grandTotal,
                profit,
                paymentMethod,
                paymentStatus,
                createdAt: new Date().toISOString(),
                createdBy: state.currentUser?.username || 'admin'
            };
            
            // Deduct stock
            billingCart.forEach(item => {
                const product = state.products.find(p => p.id === item.productId);
                if (product) {
                    product.stock -= item.qty;
                    product.updatedAt = new Date().toISOString();
                }
            });
            
            state.bills.push(bill);

            // Create warranty records (one per line item, plus one shared code for the whole bill)
            const months = state.settings.warrantyMonths || 12;
            const warrantyCodes = [];
            bill.billWarrantyCode = generateBillWarrantyCode(bill);
            bill.firebaseSynced = false;
            bill.items.forEach(item => {
                for (let q = 0; q < item.qty; q++) {
                    const code = generateWarrantyCode();
                    const start = new Date(bill.createdAt);
                    const end = new Date(start);
                    end.setMonth(end.getMonth() + months);
                    const warranty = {
                        id: state.nextWarrantyId++,
                        code,
                        billWarrantyCode: bill.billWarrantyCode,
                        billId: bill.id,
                        invoiceNo: bill.invoiceNo,
                        productId: item.productId,
                        productName: item.name,
                        productImage: item.image,
                        brand: item.brand || '',
                        chip: item.chip || '',
                        ram: item.ram || '',
                        storage: item.storage || '',
                        size: item.size || '',
                        specs: item.specs || '',
                        customerId: customer.id,
                        customerName: name,
                        customerNic: nic,
                        customerMobile: mobile,
                        startDate: start.toISOString(),
                        endDate: end.toISOString(),
                        months,
                        status: 'Active', // Active | Cancelled | Expired
                        pageHtml: '',
                        createdAt: new Date().toISOString(),
                        cancelledAt: null,
                        cancelReason: ''
                    };
                    // Build standalone warranty page HTML for local/offline viewing & download
                    warranty.pageHtml = buildWarrantyPageHtml(warranty);
                    state.warranties.push(warranty);
                    warrantyCodes.push(code);
                }
            });
            bill.warrantyCodes = warrantyCodes;

            saveData();

            (async () => {
                if (state.settings.firebase?.connected) {
                    const ok = await syncBillWarrantyToFirebase(bill);
                    if (!ok) {

            document.getElementById('bill-customer-nic').value = '';
            document.getElementById('bill-customer-mobile').value = '';
            document.getElementById('cart-discount').value = 0;

        function generateWarrantyCode() {
            const n = String(state.nextWarrantyId).padStart(5, '0');
            const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
            return `ZD-W-${n}-${rand}`;
        }

        // One unique code per bill — this is what the invoice QR encodes.
        function generateBillWarrantyCode(bill) {
            const n = String(bill.id).padStart(5, '0');
            const rand = Math.random().toString(36).substring(2, 7).toUpperCase();
            return `ZD-WB-${n}-${rand}`;
        }

        function getWarrantyQrContent(bill) {
            if (!bill.billWarrantyCode) return state.settings.businessWebsite || 'https://www.zerodevice.lk';
            const fb = state.settings.firebase;
            if (!fb?.config?.projectId || !fb?.config?.apiKey) {
                return state.settings.businessWebsite || state.settings.businessName || 'Connect Firebase in Settings';
            }
            if (!fb.connected) {
                return state.settings.businessWebsite || 'Connect Firebase in Settings for warranty QR';
            }
            let base = window.location.href.split('#')[0].split('?')[0];
            if (base.startsWith('file:')) {
                const site = (state.settings.businessWebsite || '').trim();
                if (site && !site.startsWith('file:')) {
                    base = site.startsWith('http') ? site : ('https://' + site);
                }
            }
            const ref = encodeFirebaseRef(fb.config);
            return `${base}?fb=${ref}#warranty/${bill.billWarrantyCode}`;
        }

        function handleProductImageSelect(e) {
            const file = e.target.files?.[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('Please select a valid image file', 'error');
                return;
            }
            if (file.size > 2.5 * 1024 * 1024) {
                showToast('Image must be under 2.5 MB', 'warning');
                return;
            }
            const reader = new FileReader();
            reader.onload = (ev) => {
                pendingProductImage = ev.target.result;
                const container = document.getElementById('image-preview-container');
                const zone = document.getElementById('image-upload-zone');
                if (container && zone) {
                    zone.classList.add('has-image');
                    container.innerHTML = `
                        <img id="product-image-preview" src="${pendingProductImage}" class="w-28 h-28 rounded-xl object-cover shadow-soft border border-slate-100" alt="Preview">
                        <div class="flex items-center gap-2">
                            <button type="button" onclick="event.stopPropagation(); document.getElementById('product-image-input').click()" class="text-xs font-medium text-primary-600 hover:text-primary-700 px-3 py-1.5 rounded-lg bg-primary-50">
                                <i class="fas fa-sync-alt mr-1"></i> Replace
                            </button>
                            <button type="button" onclick="event.stopPropagation(); removeProductImage()" class="text-xs font-medium text-red-600 hover:text-red-700 px-3 py-1.5 rounded-lg bg-red-50">
                                <i class="fas fa-trash mr-1"></i> Remove
                            </button>
                        </div>
                    `;
                }
            };
            reader.readAsDataURL(file);
        }

        function removeProductImage() {
            pendingProductImage = null;
            const container = document.getElementById('image-preview-container');
            const zone = document.getElementById('image-upload-zone');
            const input = document.getElementById('product-image-input');
            if (input) input.value = '';
            if (zone) zone.classList.remove('has-image');
            if (container) {
                container.innerHTML = `
                    <div class="w-14 h-14 rounded-full bg-slate-100 flex items-center justify-center">
                        <i class="fas fa-cloud-upload-alt text-slate-400 text-xl"></i>
                    </div>
                    <div class="text-center">
                        <p class="text-sm font-medium text-slate-700">Upload Product Image</p>
                        <p class="text-xs text-slate-400 mt-0.5">Click to browse · JPG, PNG, WebP</p>
                    </div>
                `;
            }
        }

        function saveProduct(e, id) {
            e.preventDefault();
            const form = e.target;
            const data = {
                name: form.name.value.trim(),
                category: form.category.value.trim(),
                brand: form.brand.value.trim(),
                buyingCost: parseFloat(form.buyingCost.value) || 0,
                sellingPrice: parseFloat(form.sellingPrice.value) || 0,
                stock: parseInt(form.stock.value) || 0,
                ram: (form.ram?.value || '').trim(),
                storage: (form.storage?.value || '').trim(),
                size: (form.size?.value || '').trim(),
                chip: (form.chip?.value || '').trim(),
                image: pendingProductImage || sampleImages[0],
                specs: form.specs.value.trim(),
                updatedAt: new Date().toISOString()
            };
            
            if (id) {
                const idx = state.products.findIndex(p => p.id === id);
                if (idx >= 0) {
                    state.products[idx] = { ...state.products[idx], ...data };
                }
                showToast('Product updated', 'success');
            } else {
                state.products.push({
                    id: state.nextProductId++,
                    ...data,
                    description: data.specs,
                    createdAt: new Date().toISOString()
                });
                showToast('Product added', 'success');
            }
            
            pendingProductImage = null;
            saveData();
            closeModal();
            renderInventory();
        }


        function deleteProduct(id) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            state.products = state.products.filter(p => p.id !== id);
            saveData();
            showToast('Product deleted', 'success');
            renderInventory();
        }

        function filterCustomers() {
            const q = document.getElementById('customer-search').value.toLowerCase();

                c.nic.includes(q) ||
                c.mobile.includes(q)

        function viewCustomerHistory(id) {
            const customer = state.customers.find(c => c.id === id);

            const purchases = state.bills
                .filter(b => b.customerId === id || b.customerNic === customer.nic)

            openModal(`

        }

        function filterWarranties() {
            const q = (document.getElementById('warranty-search')?.value || '').toLowerCase();
            const st = document.getElementById('warranty-status-filter')?.value || '';
            const now = new Date();
            let list = [...(state.warranties || [])];
            if (q) {
                list = list.filter(w =>
                    w.code.toLowerCase().includes(q) ||
                    (w.customerName || '').toLowerCase().includes(q) ||
                    (w.productName || '').toLowerCase().includes(q) ||
                    (w.invoiceNo || '').toLowerCase().includes(q) ||
                    (w.customerNic || '').includes(q)
                );
            }
            if (st) {
                list = list.filter(w => {
                    let status = w.status;
                    if (status === 'Active' && new Date(w.endDate) < now) status = 'Expired';
                    return status === st;
                });
            }
            list.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            document.getElementById('warranty-table-body').innerHTML = renderWarrantyRows(list);
        }

        async function cancelWarranty(code) {
            const w = state.warranties.find(x => x.code === code);
            if (!w || w.status !== 'Active') return;
            const reason = prompt('Cancel reason (optional):') || '';
            if (!confirm(`Cancel warranty ${code}? Customer scan pannalum CANCELLED nu show aagum.`)) return;
            w.status = 'Cancelled';
            w.cancelledAt = new Date().toISOString();
            w.cancelReason = reason;
            w.pageHtml = buildWarrantyPageHtml(w);
            saveData();
            if (state.settings.firebase?.connected && w.billId) {
                const bill = state.bills.find(b => b.id === w.billId);
                if (bill) {
                    const ok = await syncBillWarrantyToFirebase(bill);
                    if (ok) showToast(`Warranty ${code} cancelled & Firebase update aachu`, 'success');
                    else showToast(`Warranty ${code} cancelled locally — Firebase sync fail`, 'warning');
                } else {
                    showToast(`Warranty ${code} cancelled`, 'success');
                }
            } else {
                showToast(`Warranty ${code} cancelled (Firebase not connected)`, 'warning');
            }
            renderWarranty();
        }

            const w = state.warranties.find(x => x.code === code);

            const html = w.pageHtml || buildWarrantyPageHtml(w);

            a.download = `warranty_${code}.html`;

            return `<!DOCTYPE html>
